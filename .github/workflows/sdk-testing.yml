name: SDK Test Automation

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  test-java:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'line/line-bot-sdk-java'
          submodules: recursive

      - name: Update line-openapi submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: './line-openapi'

      # https://github.com/line/line-bot-sdk-java/blob/master/.github/workflows/gradle.yml
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate code
        run: python3 generate-code.py

      - name: Show diff
        run: |
          git add .
          git diff --color=always --staged

      - name: Post PR comment
        if : ${{ github.event_name == 'pull_request' }}
        uses: ./line-openapi/.github/actions/post-comment-action
        with:
          language: java
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: ./gradlew build

  test-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'line/line-bot-sdk-python'
          submodules: recursive

      - name: Update line-openapi submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: './line-openapi'

      # https://github.com/line/line-bot-sdk-python/blob/master/.github/workflows/auto-testing.yml
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Generate code
        run: python3 generate-code.py

      - name: Show diff
        run: |
          git add .
          git diff --color=always --staged

      - name: Post PR comment
        if : ${{ github.event_name == 'pull_request' }}
        uses: ./line-openapi/.github/actions/post-comment-action
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: tox

  test-php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'line/line-bot-sdk-php'
          submodules: recursive

      - name: Update line-openapi submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: './line-openapi'

      # https://github.com/line/line-bot-sdk-php/blob/master/.github/workflows/php-checks.yml
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate code
        run: python3 generate-code.py

      - name: Install dependencies with Composer
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Show diff
        run: |
          git add .
          git diff --color=always --staged

      - name: Post PR comment
        if : ${{ github.event_name == 'pull_request' }}
        uses: ./line-openapi/.github/actions/post-comment-action
        with:
          language: php
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: composer check

  test-nodejs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'line/line-bot-sdk-nodejs'
          submodules: recursive

      - name: Update line-openapi submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: './line-openapi'

      # https://github.com/line/line-bot-sdk-nodejs/blob/master/.github/workflows/test.yml
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 17
          architecture: x64

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Dependency
        run: npm ci

      - name: Generate code
        run: python3 generate-code.py

      - name: Show diff
        run: |
          git add .
          git diff --color=always --staged

      - name: Post PR comment
        if : ${{ github.event_name == 'pull_request' }}
        uses: ./line-openapi/.github/actions/post-comment-action
        with:
          language: nodejs
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: npm run checkAll

  test-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'line/line-bot-sdk-go'
          submodules: recursive

      - name: Update line-openapi submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: './line-openapi'

      # https://github.com/line/line-bot-sdk-go/blob/master/.github/workflows/go.yml
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 17
          architecture: x64

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate code
        run: python3 generate-code.py

      - name: Show diff
        run: |
          git add .
          git diff --color=always --staged

      - name: Post PR comment
        if : ${{ github.event_name == 'pull_request' }}
        uses: ./line-openapi/.github/actions/post-comment-action
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: bash script/checkAll.sh

  test-ruby:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'line/line-bot-sdk-ruby'
          submodules: recursive

      - name: Update line-openapi submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: './line-openapi'

      # https://github.com/line/line-bot-sdk-ruby/blob/master/.github/workflows/pull_request.yml
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: 4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 17
          architecture: x64
      - run: bundle install

      - name: Generate code
        run: python3 generate-code.py

      - name: Show diff
        run: |
          git add .
          git diff --color=always --staged

      - name: Post PR comment
        if : ${{ github.event_name == 'pull_request' }}
        uses: ./line-openapi/.github/actions/post-comment-action
        with:
          language: ruby
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: bundle exec rake ci
